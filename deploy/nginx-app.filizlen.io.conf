# /etc/nginx/sites-available/app.filizlen.io
# app.filizlen.io — HTTPS + reverse proxy to Next.js (port 3011)

server {
    listen 80;
    listen [::]:80;
    server_name app.filizlen.io;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name app.filizlen.io;

    ssl_certificate /etc/letsencrypt/live/app.filizlen.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.filizlen.io/privkey.pem;
    include /etc/nginx/snippets/ssl-params.conf;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    access_log /var/log/nginx/filizlen-web-app-access.log;
    error_log /var/log/nginx/filizlen-web-app-error.log;

    # Backend API (Hono)
    location /api/ {
        proxy_pass http://127.0.0.1:3012/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://127.0.0.1:3011;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
