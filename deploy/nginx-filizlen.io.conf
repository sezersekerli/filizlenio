# /etc/nginx/sites-available/filizlen.io
# Filizlen.io — HTTPS + reverse proxy to Next.js (port 3010)

server {
    listen 80;
    listen [::]:80;
    server_name filizlen.io www.filizlen.io;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://filizlen.io$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.filizlen.io;

    ssl_certificate /etc/letsencrypt/live/filizlen.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/filizlen.io/privkey.pem;
    include /etc/nginx/snippets/ssl-params.conf;

    return 301 https://filizlen.io$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name filizlen.io;

    ssl_certificate /etc/letsencrypt/live/filizlen.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/filizlen.io/privkey.pem;
    include /etc/nginx/snippets/ssl-params.conf;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    access_log /var/log/nginx/filizlenio-access.log;
    error_log /var/log/nginx/filizlenio-error.log;

    location / {
        proxy_pass http://127.0.0.1:3010;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}
