# Marketing site — filizlen.io
# Place in /etc/nginx/sites-available/ and symlink to sites-enabled

server {
    listen 80;
    listen [::]:80;
    server_name filizlen.io www.filizlen.io;
    return 301 https://filizlen.io$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.filizlen.io;
    return 301 https://filizlen.io$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name filizlen.io;

    # ssl_certificate /etc/letsencrypt/live/filizlen.io/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/filizlen.io/privkey.pem;

    location / {
        proxy_pass http://127.0.0.1:3010;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
