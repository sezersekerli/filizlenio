# Filizlen Supabase local config
# See https://supabase.com/docs/guides/cli/config

project_id = "filizlen"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[db.pooler]
enabled = false

[studio]
enabled = true
port = 54323

[inbucket]
enabled = true
port = 54324

[storage]
enabled = true

[auth]
enabled = true
site_url = "https://app.filizlen.io"
additional_redirect_urls = [
  "http://localhost:3001/auth/callback",
  "https://app.filizlen.io/auth/callback",
  "filizlen://auth/callback",
]
jwt_expiry = 3600
enable_signup = true

# Google: .env içinde GOOGLE_CLIENT_ID + GOOGLE_CLIENT_SECRET tanımlayıp
# `npx supabase stop && npx supabase start` ile açın. Yoksa invalid_client hatası verir.
[auth.external.google]
enabled = false
client_id = "env(GOOGLE_CLIENT_ID)"
secret = "env(GOOGLE_CLIENT_SECRET)"
skip_nonce_check = false

[auth.email]
enable_signup = true
enable_confirmations = false
double_confirm_changes = false
